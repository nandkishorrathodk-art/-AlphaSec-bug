<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>JB-Chat · Prompt-Injection Research Copilot</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #12181f; --line: #1f2937;
    --fg: #d7e2ea; --dim: #7c8b9a; --accent: #22d3ee;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: radial-gradient(1200px 600px at 70% -10%, #122433, var(--bg));
    color: var(--fg); font-family: var(--mono); font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: rgba(11,15,20,.85);
    backdrop-filter: blur(6px); flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 15px; letter-spacing: .5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
  }
  .pill b { color: var(--accent); font-weight: 600; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 18px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 92%; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .u { align-self: flex-end; background: #123a47; border: 1px solid #1b5566; padding: 8px 12px; border-radius: 12px 12px 3px 12px; }
  .a { align-self: flex-start; }
  .a pre {
    background: #0d1720; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px;
  }
  .tag { font-size: 10px; color: var(--dim); margin-bottom: 3px; letter-spacing: .8px; text-transform: uppercase; }
  .ok { color: var(--good); } .warn { color: var(--warn); } .sys { color: var(--dim); font-style: italic; }
  #inputbar {
    display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line);
    background: rgba(11,15,20,.9);
  }
  #input {
    flex: 1; background: #0d1720; border: 1px solid var(--line); color: var(--fg);
    padding: 11px 14px; border-radius: 8px; font-family: var(--mono); font-size: 13.5px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #06232c; border: 0; font-weight: 700;
    padding: 0 20px; border-radius: 8px; cursor: pointer; font-family: var(--mono);
  }
  #send:hover { filter: brightness(1.12); }
  #hint { color: var(--dim); font-size: 11.5px; padding: 4px 18px 12px; }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="statusDot"></span>JB-Chat <span class="blink">▊</span></h1>
  <span class="pill" id="targetPill">target: —</span>
  <span class="pill" id="modePill">mode: —</span>
</header>

<main id="chat"></main>

<div id="hint">Paste the target's reply to get the next prompts · <b>/read</b> &lt;reply&gt; · <b>/goal</b> &lt;objective&gt; · <b>/state</b> · <b>/moves</b> · <b>/reset</b> · <b>/help</b></div>

<div id="inputbar">
  <input id="input" placeholder="Paste the other AI's reply here…" autocomplete="off" spellcheck="false"/>
  <button id="send">Send ⏎</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function el(tag, text, cls) {
  const d = document.createElement('div');
  d.className = cls ? `msg a ${cls}` : 'msg a';
  d.textContent = text;
  return d;
}

function addUser(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg u';
  wrap.textContent = text;
  chat.appendChild(wrap);
}

function addAssistant(text, cls) {
  const wrap = el('div', '', cls || '');
  wrap.innerHTML = '';
  const tag = document.createElement('div');
  tag.className = 'tag ' + (cls || '');
  tag.textContent = 'jb-chat';
  wrap.appendChild(tag);
  const pre = document.createElement('pre');
  pre.textContent = text;
  wrap.appendChild(pre);
  chat.appendChild(wrap);
}

function addSystem(text) {
  const d = el('div', text, 'sys');
  chat.appendChild(d);
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  addUser(text);
  input.value = '';
  if (ws && ws.readyState === 1) ws.send(text);
  else addSystem('(not connected — restart app)');
}

async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    document.getElementById('targetPill').innerHTML = 'target: <b>' + s.target + '</b>';
    document.getElementById('modePill').innerHTML = 'mode: <b>' + (s.dry_run ? 'dry-run' : 'live') + '</b>';
    document.getElementById('statusDot').classList.add('on');
  } catch (e) {}
}

let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'system') addSystem(m.content);
    else if (m.type === 'assistant') addAssistant(m.content);
    else if (m.type === 'tip') addAssistant('💡 ' + m.content, 'warn');
    else if (m.type === 'result') addAssistant(m.content, m.success ? 'ok' : 'warn');
    else if (m.type === 'plan') addAssistant('Plan ready — ' + (m.goal || '') + '\n\nchain: ' + m.chain.join(' → '), 'ok');
    chat.scrollTop = chat.scrollHeight;
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

sendBtn.onclick = send;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

loadStatus();
connect();
</script>
</body>
</html>
